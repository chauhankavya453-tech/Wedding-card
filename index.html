<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6d1630">
  <meta name="description" content="Sanchita weds Pradyumna — a digital Indian wedding invitation.">
  <title>Sanchita weds Pradyumna | Wedding Invitation</title>
  <style>
    :root { --wine:#69152f; --deep:#3d1026; --gold:#d7a63f; --ink:#4b2630; }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; }
    body { min-height:100svh; overflow:hidden; color:var(--ink); font-family:Georgia,"Times New Roman",serif; background:radial-gradient(circle at 50% 20%,#a53850 0,var(--wine) 42%,var(--deep) 100%); }
    .scene { min-height:100svh; display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; padding:24px 16px; overflow:hidden; isolation:isolate; }
    .scene::before { content:""; position:absolute; inset:14px; border:1px solid rgba(239,197,105,.45); border-radius:22px; pointer-events:none; z-index:-1; }
    .intro { text-align:center; color:#fff4da; margin-bottom:18px; z-index:2; animation:fade-up .8s ease both; }
    .intro .kicker { color:#f0c76d; font:11px/1.5 Arial,sans-serif; letter-spacing:4px; text-transform:uppercase; }
    .intro h1 { margin:8px 0 5px; font-size:clamp(27px,6vw,48px); font-weight:normal; line-height:1.05; text-shadow:0 3px 18px #330b1d; }
    .intro p { margin:0; color:#f8dfc8; font-size:14px; font-style:italic; }
    .invitation { position:relative; width:min(92vw,520px); height:min(70vh,620px); min-height:455px; overflow:hidden; z-index:2; }

    /* Unchanged simple envelope-to-card slide animation. */
    .card { position:absolute; inset:0; z-index:1; transform:translateY(105%); transition:transform 1.25s cubic-bezier(.2,.75,.2,1); pointer-events:none; }
    .envelope { position:absolute; inset:13% 0 7%; z-index:2; cursor:pointer; transition:opacity .55s ease,transform .55s ease; outline:none; }
    .envelope:focus-visible { filter:drop-shadow(0 0 10px #f7d178); }
    .envelope-body { position:absolute; inset:0; border:1px solid #e7b555; border-radius:10px 10px 18px 18px; background:linear-gradient(135deg,#a92c4e,#781631 53%,#531126); box-shadow:0 24px 50px #260716,inset 0 0 34px rgba(255,184,130,.17); overflow:hidden; }
    .envelope-body::before,.envelope-body::after { content:""; position:absolute; bottom:0; width:50%; height:100%; background:rgba(255,191,133,.1); }
    .envelope-body::before { left:0; clip-path:polygon(0 0,100% 100%,0 100%); }
    .envelope-body::after { right:0; clip-path:polygon(100% 0,100% 100%,0 100%); }
    .envelope-label { position:absolute; inset:0; display:grid; place-items:center; color:#ffe9b3; text-align:center; z-index:1; }
    .envelope-label .symbol { display:block; color:#f7d276; font-size:48px; margin-bottom:12px; }
    .envelope-label span:last-child { display:block; font:11px Arial,sans-serif; letter-spacing:2px; text-transform:uppercase; }

    /* The uploaded invitation is the revealed card. */
    .card-image { display:block; width:100%; height:100%; object-fit:contain; border:2px solid var(--gold); border-radius:8px; background:#fff8ea; box-shadow:0 14px 35px rgba(28,4,14,.45); }

    /* Unchanged one-tap reveal states. */
    .opened .envelope { opacity:0; transform:translateY(-12px); pointer-events:none; }
    .opened .card { transform:translateY(0); pointer-events:auto; }
    .petals { position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:-1; }
    .petal { position:absolute; top:-25px; width:10px; height:17px; border-radius:100% 0 100% 0; background:#f1b9a8; opacity:.72; animation:fall 10s linear infinite; }
    .petal:nth-child(2n) { width:7px; height:11px; background:#eac768; animation-duration:13s; }
    @keyframes fall { to { transform:translate3d(80px,110vh,0) rotate(280deg); } }
    @keyframes fade-up { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
    @media (max-height:650px) { .scene{padding-top:18px}.intro{margin-bottom:9px}.intro h1{font-size:27px}.invitation{height:calc(100svh - 115px);min-height:390px} }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; transition-duration:.01ms!important; } }
  </style>
</head>
<body>
  <main class="scene">
    <div class="petals" aria-hidden="true"><i class="petal" style="left:7%"></i><i class="petal" style="left:19%"></i><i class="petal" style="left:33%"></i><i class="petal" style="left:51%"></i><i class="petal" style="left:67%"></i><i class="petal" style="left:82%"></i><i class="petal" style="left:94%"></i></div>
    <header class="intro"><div class="kicker">A celebration of love</div><h1>Save the date</h1><p>Tap the envelope to open your invitation</p></header>
    <section class="invitation" id="invitation">
      <article class="card" id="card" aria-hidden="true">
        <img class="card-image" src="cute.png" alt="Sanchita weds Pradyumna Indian wedding invitation">
      </article>
      <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Open the wedding invitation">
        <div class="envelope-body"><div class="envelope-label"><div><span class="symbol">❈</span><span>Tap to open</span></div></div></div>
      </div>
    </section>
  </main>
  <script>
    (() => {
      const invitation = document.getElementById('invitation');
      const envelope = document.getElementById('envelope');
      const card = document.getElementById('card');
      const openInvitation = () => {
        if (invitation.classList.contains('opened')) return;
        invitation.classList.add('opened');
        card.setAttribute('aria-hidden', 'false');
      };
      envelope.addEventListener('click', openInvitation);
      envelope.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          openInvitation();
        }
      });
    })();
  </script>
</body>
</html>
